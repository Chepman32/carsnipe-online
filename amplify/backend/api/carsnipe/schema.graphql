type User @model
  @auth(rules: [
    { allow: public, operations: [create, update, delete, read] }
  ]) {
  id: ID!
  nickname: String
  money: Int
  cars: [Car] @manyToMany(relationName: "UserCar")
  auctions: [Auction] @manyToMany(relationName: "AuctionUser")
  email: String
  bidded: [BidInfo]
  avatar: String
  bio: String
  achievements: [Achievement]
  sold: [ID]
  totalCarsOwned: Int
  totalAuctionsParticipated: Int
  totalBidsPlaced: Int
  totalSpent: Int
  totalAuctionsWon: Int
  totalProfitEarned: Int
  conversations: [Conversation] @manyToMany(relationName: "UserConversation")
}

type Car @model
  @auth(rules: [
    { allow: public, operations: [create, update, delete, read] }
  ]) {
  id: ID!
  make: String!
  model: String!
  year: Int!
  price: Int!
  type: String
  purchasePrice: Int
  sellPrice: Int
  inAuction: Boolean
  users: [User] @manyToMany(relationName: "UserCar")
}

type Auction @model
  @auth(rules: [
    { allow: public, operations: [create, update, delete, read] }
  ]) {
  id: ID!
  make: String!
  model: String!
  year: Int
  carId: String
  currentBid: Int
  endTime: String!
  status: String!
  lastBidPlayer: String
  player: String!
  buy: Int!
  minBid: Int!
  type: String!
  user: [User] @manyToMany(relationName: "AuctionUser")
  bidsCount: Int
  finishedAt: String
}

type Achievement {
  name: String!
  date: String!
}

type BidInfo {
  auctionId: ID!
  bidValue: Int!
  timestamp: String
}

type Conversation @model
  @auth(rules: [
    { allow: public, operations: [create, update, delete, read] }
  ]) {
  id: ID!
  name: String
  participants: [User] @manyToMany(relationName: "UserConversation")
  messages: [Message] @hasMany
  lastMessageAt: String
  lastMessageContent: String
  lastMessageSenderId: ID
  isGroup: Boolean
}

type Message @model
  @auth(rules: [
    { allow: public, operations: [create, update, delete, read] }
  ]) {
  id: ID!
  conversationId: ID!
  senderId: ID!
  content: String!
  timestamp: String!
  read: Boolean
  isEvent: Boolean
  conversation: Conversation @belongsTo(fields: ["conversationId"])
}